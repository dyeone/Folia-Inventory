<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Folia Label Helper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header>
      <strong>Folia Label Helper</strong>
      <a id="openOptions" href="#" title="Settings">⚙︎</a>
    </header>

    <div id="needsConfig" class="card warn" hidden>
      <p>Settings not configured yet.</p>
      <button id="goOptions" class="primary">Open settings</button>
    </div>

    <div id="notOnPalmstreet" class="card warn" hidden>
      <p>Open Palmstreet in this tab to use the extension.</p>
    </div>

    <div id="ready" hidden>
      <div class="card">
        <div class="row">
          <strong id="queueCount">—</strong>
          <span class="muted">USPS boxes waiting for labels</span>
          <button id="refresh" class="link">Refresh</button>
        </div>
        <ul id="queue" class="queue"></ul>
      </div>

      <div class="row scale-row">
        <span id="scaleLabel" class="muted">Scale: not paired</span>
        <button id="readScale" class="link">Read</button>
      </div>

      <div class="modes">
        <button id="modeSync" class="mode">
          <strong>Sync tracking only</strong>
          <small>Read tracking, no clicks</small>
        </button>
        <button id="modeBuy" class="mode primary">
          <strong>Buy + sync selected</strong>
          <small>Walks all 8 steps</small>
        </button>
      </div>

      <div id="progress" class="card" hidden>
        <div class="row">
          <strong id="progLabel">Working…</strong>
          <button id="stop" class="link">Stop</button>
        </div>
        <div class="bar"><div id="progFill"></div></div>
        <ul id="log" class="log"></ul>
      </div>
    </div>

    <script src="scale.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
